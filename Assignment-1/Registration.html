<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport">
    <title>Student Registration</title>
</head>
<body bgcolor="beige">
<header>
    <h1><style color="white">Xeno Sports Registration</style></h1>
</header>
<center>
<nav>
    <a href="Home.html">Home</a> 
    <a href="Information.html">Information</a> 
    <a href="Registration.html">Registration</a> 
    <a href="Resources.html">Resources</a>
</nav>
</center>
<hr>
<main>
    <section>
        <h2>Regester Here</h2>
        <form action="#" method="get">
            <fieldset>
                <h3>Personal Details</h3>

                <label for="name">Student Name:</label>
                <input type="text" id="name" name="name"
                       placeholder="Enter your name" required><br>

                <p>Gender:</p>
                <input type="radio" id="male" name="gender" value="male">
                <label for="male">Male</label>
                <input type="radio" id="female" name="gender" value="female">
                <label for="female">Female</label><br>

                <label for="phone">Phone:</label>
                <input type="tel" id="phone" name="phone"
                       placeholder="Enter phone number"><br>

                <label for="age">Age:</label>
                <input type="age" id="age" name="age"
                       placeholder="Enter your Age" required><br>

                <label for="sports">Select Sports:</label>
                <select id="sports" name="sports">
                    <option value="cricket">Cricket</option>
                    <option value="football">Football</option>
                    <option value="kabbadi">Kabbadi</option>
                    <option value="athletics">Athletics</option>
                </select><br>

                <label for="">Student class:</label>
                <input type="class" id="class" name="class"
                       placeholder="Enter your class"><br>

                <p>Section:</p>
                <input type="radio" id="a" name="section" value="A">
                <label for="section">A</label>
                <input type="radio" id="b" name="section" value="B">
                <label for="section">B</label>
                <input type="radio" id="c" name="section" value="C">
                <label for="section">C</label>
                <input type="radio" id="d" name="section" value="D">
                <label for="section">D</label>
<br>
                <label>Your Address;</label>
                <textarea rows="5"placeholder="Write your Address"required></textarea><br><br>

                <button type="submit">Submit Registration</button>
                <button type="reset">Clear Form</button>
            </fieldset>
        </form>
    </section>
</main>
<center>
       <img src="Register.jpeg"
   alt="Register Here" width="300">
</center>
<center>
<footer>
    <hr><p>___Contact Us___</p>
</footer>
</center>
</body>
</html>
